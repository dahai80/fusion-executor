[project]
name = "fusion-executor"
version = "0.2.20"
description = "Fusion-Executor — controlled execution sandbox + macOS OS-level control hub"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fusion-MLX Team" }]
# Issue #60 (config Phase 2.2): fusion_core.config 单点 key/env 解析 — client_key() 等。
# bare 约束 (同 fusion-rag): 本地 monorepo 用共享 venv 的 editable fusion-core 满足;
# CI 在 maturin 前显式 pip install git pin (见 .github/workflows/ci.yml)。
dependencies = ["pydantic>=2.0.0", "fusion-core>=0.7.0"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]

[project.scripts]
fusion-executor = "fusion_executor.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["python/tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["fusion_executor"]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/fe-pyo3/Cargo.toml"
python-source = "python"
module-name = "fusion_executor._native"
features = ["pyo3/extension-module"]
