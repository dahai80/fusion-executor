name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust build + test + lint
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Install Python (libpython for native extension feature)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # D3-6/ARCH-2: setup-python 把 python3 装到 hostedtoolcache 路径 (非基线 TRUSTED_BIN_DIRS)。
      # cargo test 的 fe-core 用例 spawn `python3 -c ...` 子进程, Executor::new() 的 resolved-path
      # fail-closed 校验会拦 hostedtoolcache python3 (不在可信目录) → 命令被阻, 7 个子进程用例红。
      # 建 venv 并在 Test 步激活: VIRTUAL_ENV/bin 被 Executor::new() 自动登记为可信目录,
      # python3 解析到 .venv/bin/python3 → 校验通过。与 Python job + 本地 venv 用法一致 (CLAUDE.md 强制 venv)。
      # fe-security allows_pytest 用例 validate("pytest ...") 需 pytest 可解析 (D3-6 None=fail-closed),
      # 裸 venv 无 pytest → 装 pytest 使 .venv/bin/pytest 存在并解析入可信 venv bin。
      - name: Create venv + install pytest (cargo test resolves python3/pytest via trusted venv bin)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --quiet pytest

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: source .venv/bin/activate && cargo test --workspace --release

  python:
    name: Python build + test + lint
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv + install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio pytest-cov ruff

      - name: Build native extension (editable)
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: ruff check
        run: |
          source .venv/bin/activate
          ruff check .

      - name: ruff format check
        run: |
          source .venv/bin/activate
          ruff format . --check

      - name: pytest
        run: |
          source .venv/bin/activate
          pytest python/tests -v
