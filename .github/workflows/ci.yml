name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust build + test + lint
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Install Python (libpython for native extension feature)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace --release

  python:
    name: Python build + test + lint
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin + test deps
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio pytest-cov ruff

      - name: Build native extension (editable)
        run: maturin develop --release

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format . --check

      - name: pytest
        run: pytest python/tests -v
